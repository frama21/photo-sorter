services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: photo-sorter:latest
    container_name: photo-sorter
    restart: unless-stopped
    ports:
      # host:container — open http://localhost:8080
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
